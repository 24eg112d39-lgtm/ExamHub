# Development Profile
spring.datasource.url=${DEV_DATABASE_URL:jdbc:h2:mem:examhub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway Migrations enabled
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
