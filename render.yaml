# Render Blueprint Specification for ExamHub (Full-Stack Java 21 + React Vite + PostgreSQL)
version: "1"

services:
  # Spring Boot Backend Web Service
  - type: web
    name: examhub-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: examhub-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.onrender.com,http://localhost:5173

  # React Vite Frontend Static Site (Global CDN - no plan or region needed)
  - type: web
    name: examhub-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://examhub-backend-7d97.onrender.com/api

databases:
  # Managed PostgreSQL Database
  - name: examhub-db
    plan: free
    region: oregon
    databaseName: examhub
    user: examhub_user
